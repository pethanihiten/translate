<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Meeting English with Hindi | मीटिंग इंग्लिश</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap');
  :root{
    --bg:#cdbfa3; --card:#fffdf6; --text:#2b2b2b; --muted:#7a6f5c;
    --primary:#3b5bdb; --accent:#e8590c;
    --hindi:#c0392b; --en:#1b3a6b; --border:#e2d8c0; --shadow:0 10px 30px rgba(0,0,0,.18);
    --chip:#fff3d6;
    --paper:#fffdf6; --line:#bcd6ef; --margin-red:#e06666; --pencil:#8a7d66;
    --rh:34px; --hand:'Patrick Hand','Comic Sans MS',cursive; --title:'Caveat','Segoe Script',cursive;
  }
  [data-theme="dark"]{
    --bg:#171a1f; --card:#21262e; --text:#e7e3d8; --muted:#9b9384;
    --primary:#748ffc; --accent:#ffa94d;
    --hindi:#ff8787; --en:#a5c8ff; --border:#39404a; --shadow:0 10px 30px rgba(0,0,0,.5);
    --chip:#2c2417;
    --paper:#21262e; --line:#33414e; --margin-red:#a3565a; --pencil:#9b9384;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans',Roboto,sans-serif;
    background:var(--bg);
    background-image:radial-gradient(rgba(0,0,0,.05) 1px,transparent 1px);
    background-size:18px 18px;
    color:var(--text); line-height:1.6; transition:background .3s,color .3s; padding-bottom:60px;
  }
  .hindi{font-family:'Noto Sans Devanagari','Mangal','Segoe UI',sans-serif}

  header{
    background:linear-gradient(135deg,#1f6b4d,#16513a); color:#fff;
    padding:30px 16px 26px; text-align:center; box-shadow:var(--shadow);
    border-bottom:6px solid #c79a3a; position:relative;
  }
  header h1{font-family:var(--title); font-size:2.3rem; font-weight:700; text-shadow:1px 2px 0 rgba(0,0,0,.25)}
  header p{opacity:.95; margin-top:2px; font-size:1rem}
  header .label-sticker{
    display:inline-block; margin-top:12px; background:#fffdf6; color:#2b2b2b;
    padding:5px 22px; border-radius:4px; font-family:var(--hand); font-size:1.05rem;
    box-shadow:0 3px 8px rgba(0,0,0,.3); transform:rotate(-1.5deg); border:1px solid #d9cdb0;
  }
  .top-controls{position:absolute; top:14px; right:14px; display:flex; gap:8px}
  .icon-btn{
    background:rgba(255,255,255,.2); border:none; color:#fff; cursor:pointer;
    width:42px; height:42px; border-radius:12px; font-size:1.2rem;
    display:grid; place-items:center; transition:transform .15s,background .2s;
  }
  .icon-btn:hover{background:rgba(255,255,255,.35); transform:translateY(-2px)}

  .container{max-width:920px; margin:0 auto; padding:16px}

  .nav-link{
    display:inline-flex; align-items:center; gap:6px; text-decoration:none;
    font-family:var(--hand); font-size:1.05rem; color:var(--primary);
    background:var(--card); border:1px solid var(--border); border-radius:8px;
    padding:7px 14px; margin-bottom:6px; box-shadow:0 2px 6px rgba(0,0,0,.08);
  }
  .nav-link:hover{transform:translateY(-2px)}
  .page-nav{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
  .nav-link.active{background:var(--primary); color:#fff; border-color:var(--primary); cursor:default; transform:none}

  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:12px 0;
    position:sticky; top:0; z-index:20; background:transparent; padding:10px 0}
  .search-wrap{flex:1; min-width:200px; position:relative}
  .search-wrap span{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted)}
  #search{width:100%; padding:12px 12px 12px 38px; border-radius:12px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:1rem; outline:none}
  #search:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--chip)}
  .pill-btn{padding:11px 16px; border-radius:12px; border:1px solid var(--border); background:var(--card);
    color:var(--text); cursor:pointer; font-family:var(--hand); font-size:1rem; white-space:nowrap}
  .pill-btn:hover{border-color:var(--primary)}

  .tabs{display:flex; gap:8px; overflow-x:auto; padding:6px 2px 0; scrollbar-width:thin}
  .tab{flex:0 0 auto; padding:7px 14px; border-radius:6px 6px 0 0; cursor:pointer;
    background:var(--card); border:1px solid var(--border); border-bottom:none; color:var(--text);
    font-family:var(--hand); font-size:1rem; transition:all .2s; box-shadow:0 -2px 6px rgba(0,0,0,.06)}
  .tab:hover{transform:translateY(-3px)}
  .tab.active{background:#c79a3a; color:#fff; border-color:#c79a3a}

  #catContainer{
    background:var(--paper);
    background-image:repeating-linear-gradient(var(--paper) 0 calc(var(--rh) - 1px),
      var(--line) calc(var(--rh) - 1px) var(--rh));
    border:1px solid var(--border); border-radius:4px; box-shadow:var(--shadow);
    padding:8px 22px 28px 62px; position:relative; overflow:hidden;
  }
  #catContainer::before{content:""; position:absolute; top:0; bottom:0; left:46px; width:2px;
    background:var(--margin-red); opacity:.7}
  #catContainer::after{content:""; position:absolute; top:0; bottom:0; left:14px; width:16px;
    background-image:radial-gradient(circle, rgba(0,0,0,.18) 6px, transparent 7px);
    background-size:16px 90px; background-repeat:repeat-y; background-position:center 40px}

  .cat{border-bottom:1px dashed var(--border)}
  .cat:last-of-type{border-bottom:none}
  .cat-head{display:flex; align-items:center; gap:10px; padding:6px 0 2px; cursor:pointer;
    user-select:none; line-height:var(--rh); min-height:var(--rh)}
  .cat-emoji{font-size:1.4rem; filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
  .cat-head h2{font-family:var(--title); font-size:1.7rem; font-weight:700; color:var(--en); line-height:1.1}
  .cat-head .sub{font-family:var(--hand); font-size:1rem; color:var(--muted)}
  .cat-head .grow{flex:1}
  .chevron{font-family:var(--hand); font-size:1.2rem; color:var(--pencil); transition:transform .3s}
  .cat.open .chevron{transform:rotate(180deg)}

  .cat-body{max-height:0; overflow:hidden; transition:max-height .4s ease}
  .cat.open .cat-body{max-height:3000px}
  .hw{list-style:none; padding:0 0 12px}
  .sentence{position:relative; padding-left:30px; line-height:var(--rh)}
  .sentence .qno{position:absolute; left:0; top:0; font-family:var(--hand); color:var(--pencil);
    font-size:1.05rem; line-height:var(--rh)}
  .sentence .en{font-family:var(--hand); font-size:1.2rem; color:var(--en); line-height:var(--rh)}
  .sentence .hi{font-family:'Noto Sans Devanagari',sans-serif; font-size:1.02rem; color:var(--hindi)}
  .sentence .hi::before{content:" — "; color:var(--pencil)}
  body.hide-hindi .hi{display:none !important}
  .speak{background:none; border:none; cursor:pointer; font-size:1rem; padding:0 4px;
    filter:grayscale(.2); transition:transform .15s}
  .speak:hover{transform:scale(1.25)}
  .hl{background:#ffe066; color:#000; border-radius:2px; padding:0 2px}

  footer{text-align:center; color:var(--muted); font-size:.9rem; margin-top:26px; padding:10px; font-family:var(--hand)}
  .no-results{text-align:center; color:var(--muted); padding:24px; display:none; font-family:var(--hand)}

  @media (max-width:520px){
    header h1{font-size:1.9rem}
    .cat-head h2{font-size:1.35rem}
    #catContainer{padding-left:50px}
    #catContainer::before{left:36px}
    #catContainer::after{display:none}
    .top-controls{position:static; justify-content:center; margin-top:12px}
  }
</style>
</head>

<header>

  <div class="label-sticker hindi">💼 ऑफिस मीटिंग • Speaking Phrases</div>

    <button class="icon-btn" id="themeToggle" title="Dark / Light mode">🌙</button>

</header>

<div class="container">

const catContainer = document.getElementById('catContainer');
const tabsEl = document.getElementById('tabs');

function build(){
  CATS.forEach((c,i)=>{
    const tab = document.createElement('div');
    tab.className = 'tab'+(i===0?' active':'');
    tab.textContent = c.emoji+' '+c.name;
    tab.addEventListener('click',()=>goTo(c.id,tab));
    tabsEl.appendChild(tab);

    const sec = document.createElement('div');
    sec.className = 'cat open';
    sec.id = c.id;
    sec.innerHTML = `
      <div class="cat-head">
        <span class="cat-emoji">${c.emoji}</span>
        <div class="grow"><h2>${c.name}</h2><div class="sub hindi">${c.sub}</div></div>
        <span class="chevron">▼</span>
      </div>
      <div class="cat-body">
        <ol class="hw">
          ${c.lines.map((s,idx)=>`
            <li class="sentence" data-text="${(s[0]+' '+s[1]).toLowerCase()}">
              <span class="qno">${idx+1}.</span>
              <button class="speak" title="Listen" data-say="${s[0].replace(/"/g,'&quot;')}">🔊</button>
              <span class="en">${s[0]}</span>
              <span class="hi hindi">${s[1]}</span>
            </li>`).join('')}
        </ol>
      </div>`;
    sec.querySelector('.cat-head').addEventListener('click',()=>sec.classList.toggle('open'));
    catContainer.appendChild(sec);
  });
  // speak buttons
  catContainer.querySelectorAll('.speak').forEach(b=>{
    b.addEventListener('click',e=>{e.stopPropagation(); speak(b.dataset.say);});
  });
}
build();

function goTo(id,tab){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  tab.classList.add('active');
  const sec=document.getElementById(id); sec.classList.add('open');
  sec.scrollIntoView({behavior:'smooth',block:'start'});
}

/* Text to speech */
function speak(text){
  if(!('speechSynthesis' in window)){alert('Sorry, your browser does not support voice.');return;}
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=.9; u.pitch=1;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* Theme */
const themeBtn=document.getElementById('themeToggle');
themeBtn.addEventListener('click',()=>{
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
  themeBtn.textContent=dark?'🌙':'☀️';
});

/* Hide Hindi */
const hindiBtn=document.getElementById('hindiToggle');
hindiBtn.addEventListener('click',()=>{
  document.body.classList.toggle('hide-hindi');
  const hidden=document.body.classList.contains('hide-hindi');
  hindiBtn.style.opacity=hidden?.45:1;
  hindiBtn.title=hidden?'Show Hindi':'Hide Hindi';
});

/* Search */
const search=document.getElementById('search'); const noResults=document.getElementById('noResults');
search.addEventListener('input',()=>{
  const q=search.value.trim().toLowerCase(); let total=0;
  document.querySelectorAll('.cat').forEach(sec=>{
    let vis=0;
    sec.querySelectorAll('.sentence').forEach(li=>{
      const en=li.querySelector('.en'), hi=li.querySelector('.hi');
      const show=!q||li.dataset.text.includes(q);
      li.style.display=show?'':'none'; if(show){vis++;total++;}
      en.innerHTML=hl(en.textContent,q); hi.innerHTML=hl(hi.textContent,q);
    });
    if(q){sec.style.display=vis?'':'none'; if(vis)sec.classList.add('open');}
    else sec.style.display='';
  });
  noResults.style.display=(q&&total===0)?'block':'none';
});
function hl(text,q){
  if(!q) return text;
  const safe=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return text.replace(new RegExp('('+safe+')','ig'),'<span class="hl">$1</span>');
}
</script>
